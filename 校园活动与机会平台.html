<style>
/* 校园活动与机会平台 —— 样式（无框架、无构建） */

:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --border: #e3e6ea;
  --text: #1f2429;
  --muted: #6b7480;
  --faint: #9aa3ae;
  --accent: #2f6fed;
  --accent-soft: #eaf1fe;
  --warn: #b4690e;
  --warn-soft: #fdf3e3;
  --danger: #c0392b;
  --danger-soft: #fdecea;
  --ok: #1f7a45;
  --ok-soft: #e8f5ee;
  --radius: 10px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}

a { color: var(--accent); }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }

/* ---------------------------------------------------------------- 页头 */

.site-head {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.site-head .inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

.site-title { font-size: 17px; font-weight: 600; text-decoration: none; color: var(--text); }
.site-sub { color: var(--muted); font-size: 13px; }

/* ---------------------------------------------------------------- 筛选条 */

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 18px 0 14px; }

.chip {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  border-radius: 999px;
  padding: 5px 13px;
  font-size: 13px;
  cursor: pointer;
}

.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

.search {
  flex: 1 1 200px;
  min-width: 160px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 14px;
  background: var(--card);
}

.search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

.count { color: var(--muted); font-size: 13px; margin-left: auto; }

/* ---------------------------------------------------------------- 卡片 */

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 15px 10px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: border-color .12s, box-shadow .12s;
}

.card:hover { border-color: #c9d3e0; box-shadow: 0 2px 10px rgba(31,36,41,.06); }

.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }

.card-id { color: var(--faint); font-variant-numeric: tabular-nums; margin-right: 6px; font-size: 13px; }
.card-title { font-weight: 600; font-size: 15.5px; line-height: 1.4; }

.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: 0 0 auto; }

.badge {
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 999px;
  white-space: nowrap;
  border: 1px solid transparent;
}

.badge.open { background: var(--ok-soft); color: var(--ok); }
.badge.closed { background: #eef0f3; color: var(--muted); }
.badge.free { background: var(--accent-soft); color: var(--accent); }
.badge.long { background: #f0edfb; color: #5b46b8; }
.badge.risk { background: var(--danger-soft); color: var(--danger); }
.badge.pending { background: var(--warn-soft); color: var(--warn); }

.card-fields { margin: 10px 0 0; display: grid; grid-template-columns: 52px 1fr; gap: 3px 8px; font-size: 13.5px; }
.card-fields dt { color: var(--faint); }
.card-fields dd { margin: 0; }

.unknown { color: var(--faint); }
.unknown::after { content: ""; }

.card-note { margin-top: 9px; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 4px 9px; }

.card-foot {
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
}

.owner-link {
  font-size: 12.5px;
  color: var(--faint);
  text-decoration: none;
  border-bottom: 1px dotted var(--faint);
  background: none;
  border-left: 0; border-right: 0; border-top: 0;
  cursor: pointer;
  padding: 0;
}

.owner-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------------------------------------------------------------- 详情页 */

.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin: 16px 0; }
.panel h2 { font-size: 15px; margin: 0 0 12px; }

.detail-title { font-size: 21px; font-weight: 600; margin: 14px 0 6px; line-height: 1.35; }
.detail-meta { color: var(--muted); font-size: 13px; margin-bottom: 4px; }

.fields { display: grid; grid-template-columns: 74px 1fr; gap: 8px 12px; font-size: 14.5px; }
.fields dt { color: var(--faint); }
.fields dd { margin: 0; }

.files { list-style: none; margin: 0; padding: 0; }
.files li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.files li:last-child { border-bottom: 0; }
.files .fname { flex: 1 1 200px; }
.files .fsize { color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }

.history { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.history li { padding: 7px 0; border-bottom: 1px solid var(--border); }
.history li:last-child { border-bottom: 0; }
.history .when { color: var(--faint); font-size: 12.5px; margin-right: 8px; }
.history .from { color: var(--faint); text-decoration: line-through; }
.history .to { font-weight: 600; }

.btn {
  display: inline-block;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  border-radius: 7px;
  padding: 6px 14px;
  font-size: 13.5px;
  cursor: pointer;
  text-decoration: none;
}

.btn:hover { filter: brightness(1.06); }
.btn.secondary { background: var(--card); color: var(--accent); }
.btn.ghost { background: none; border-color: var(--border); color: var(--muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------------------------------------------------------------- 预览 */

.preview-box { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fbfcfd; }
.preview-box iframe { width: 100%; height: 78vh; border: 0; display: block; background: #fff; }
.preview-box img { max-width: 100%; display: block; margin: 0 auto; }
.preview-box pre { margin: 0; padding: 14px; overflow: auto; max-height: 70vh; font: 13px/1.7 "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.preview-box .md { padding: 16px 18px; max-height: 70vh; overflow: auto; }
.preview-box .slides { padding: 12px 16px; max-height: 70vh; overflow: auto; }
.preview-note { padding: 12px 14px; color: var(--muted); font-size: 13.5px; }

.md h1, .md h2, .md h3 { margin: 18px 0 8px; line-height: 1.35; }
.md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; }
.md p { margin: 9px 0; }
.md ul { margin: 9px 0; padding-left: 22px; }
.md code { background: #eef0f3; border-radius: 4px; padding: 1px 5px; font: 13px "Cascadia Mono", Consolas, monospace; }
.md pre { background: #eef0f3; }
.md blockquote { margin: 9px 0; padding: 4px 12px; border-left: 3px solid var(--border); color: var(--muted); }
.md table { border-collapse: collapse; margin: 10px 0; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 9px; }

/* ---------------------------------------------------------------- 表单 */

.form-row { margin-bottom: 13px; }
.form-row label { display: block; font-size: 13.5px; color: var(--muted); margin-bottom: 4px; }
.form-row .hint { color: var(--faint); font-size: 12.5px; }
.form-row input[type="text"], .form-row textarea, .form-row select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
}
.form-row input:focus, .form-row textarea:focus, .form-row select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.checkbox-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }

.msg { border-radius: 8px; padding: 10px 13px; font-size: 13.5px; margin: 12px 0; }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.err { background: var(--danger-soft); color: var(--danger); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }

.empty { text-align: center; color: var(--muted); padding: 48px 16px; }

@media (max-width: 560px) {
  .cards { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .card-foot { justify-content: space-between; }
  .preview-box iframe { height: 60vh; }
}

.offline-banner {
  background: var(--accent-soft);
  color: #1b3f86;
  border: 1px solid #cddffb;
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.7;
  margin: 14px 0 4px;
}
.offline-banner code { background: #fff; border-radius: 4px; padding: 1px 5px; }
.msg.inline { display: inline-block; margin: 0; padding: 4px 10px; font-size: 12.5px; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
</style>
</head>

<script>
/**
 * model.js —— 领域模型（无 I/O，浏览器与 Node 通用）
 *
 * 这些逻辑同时被两处使用，因此必须只有一份实现：
 *   - `server.js`：服务版（多用户、补充口令、落盘持久化）
 *   - 离线单文件版：由 tools/build-standalone.js 内联
 *
 * 内容：种子数据 → 运行时结构的映射、合并条目（09/20）的变更记录与回填、
 *       时效状态计算、日期解析、缺失字段、字段补充应用。
 *
 * 与 app.js / ooxml.js 一样采用「浏览器挂全局 / Node 可 require」的写法。
 */
(function (root, factory) {
  'use strict';
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.Model = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const SCHEMA_VERSION = 1;
  const TERM = '2026 秋季学期';
  const TERM_YEAR = 2026;

  /** 允许修改的字段 */
  const EDITABLE_FIELDS = [
    'audience', 'threshold', 'commitment', 'requirement',
    'location', 'location_status',
    'schedule', 'deadline', 'deadline_status',
    'quota', 'cost', 'outcome', 'signup_mode',
  ];

  const KEY_LABELS = {
    audience: '面向人群', threshold: '参与门槛', commitment: '投入要求', requirement: '要求',
    location: '地点', location_status: '地点状态', schedule: '时间',
    deadline: '报名截止', deadline_status: '截止状态', quota: '名额',
    cost: '费用', outcome: '收获', signup_mode: '报名方式',
    files: '活动资料',
  };

  /** 详情页字段展示顺序 */
  const DETAIL_FIELDS = [
    'audience', 'threshold', 'commitment', 'location', 'schedule',
    'deadline', 'signup_mode', 'quota', 'cost', 'outcome',
  ];

  const DATE_RE = /(\d{1,2})\s*月\s*(\d{1,2})\s*日/g;
  const TIME_RE = /(\d{1,2}):(\d{2})/g;

  /**
   * 从形如「9月24日 22:00」「9月27日 8:30—17:00」的文本中解析时间点。
   * 规则：取最后一个「M月D日」，配合该日期之后（或全串最后一个）时间；无时间则按当日 23:59。
   * 数据源中的日期没有年份，按学期年份补全（8–12 月为学期年，1–7 月为次年）。
   */
  function parseWhen(text) {
    if (!text || typeof text !== 'string') return null;
    const dates = [];
    let m;
    DATE_RE.lastIndex = 0;
    while ((m = DATE_RE.exec(text))) dates.push({ month: +m[1], day: +m[2], index: m.index });
    if (!dates.length) return null;
    const last = dates[dates.length - 1];

    const times = [];
    TIME_RE.lastIndex = 0;
    while ((m = TIME_RE.exec(text))) times.push({ h: +m[1], mi: +m[2], index: m.index });
    const after = times.filter((t) => t.index > last.index);
    const use = after.length ? after[after.length - 1] : (times.length ? times[times.length - 1] : null);

    const year = last.month >= 8 ? TERM_YEAR : TERM_YEAR + 1;
    const d = new Date(year, last.month - 1, last.day, use ? use.h : 23, use ? use.mi : 59, 0, 0);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  /**
   * 计算时效状态。不落库，每次实时计算，避免数据随时间失真。
   * 优先级：已结束 > 报名已截止 > 长期 > 无需报名 > 地点待定 > 报名中
   */
  function computeStatus(activity, now) {
    const f = (activity && activity.fields) || {};
    const ref = now instanceof Date ? now : new Date();

    const when = parseWhen(f.schedule);
    if (when && when < ref) return '已结束';

    if (f.deadline_status === '已截止') return '报名已截止';
    const dl = parseWhen(f.deadline);
    if (dl && f.deadline_status === '明确' && dl < ref) return '报名已截止';

    if (f.deadline_status === '长期') return '长期';
    if (f.deadline_status === '无需报名') return '无需报名';
    if (f.location_status === '待确认') return '地点待定';
    return '报名中';
  }

  /** 卡片上必须显式呈现的缺失项（"未注明" ≠ "没有"） */
  function missingFields(activity) {
    const f = (activity && activity.fields) || {};
    const out = [];
    if (!f.location) out.push('location');
    if (!f.deadline) out.push('deadline');
    if (!f.quota) out.push('quota');
    if (!f.cost) out.push('cost');
    if (!f.outcome) out.push('outcome');
    return out;
  }

  /** 卡片墙的一项 */
  function listItem(activity, now, history) {
    const records = history || [];
    return {
      id: activity.id,
      name: activity.name,
      status: computeStatus(activity, now),
      category: activity.category,
      riskLevel: activity.riskLevel,
      fields: activity.fields,
      missing: missingFields(activity),
      hasUpdates: records.some((r) => r.activityId === activity.id),
      updatedAt: activity.updatedAt,
    };
  }

  /** 把种子数据的一条记录映射为运行时结构 */
  function mapSeedEntry(entry, token) {
    return {
      id: entry.id,
      name: entry.name,
      editToken: token === undefined ? null : token,
      fields: {
        audience: entry.audience ?? null,
        threshold: entry.threshold ?? null,
        commitment: entry.commitment ?? null,
        requirement: entry.requirement ?? null,
        location: entry.location ?? null,
        location_status: entry.location_status ?? '未注明',
        schedule: entry.schedule ?? null,
        deadline: entry.deadline ?? null,
        deadline_status: entry.deadline_status ?? '未注明',
        quota: entry.quota ?? null,
        cost: entry.cost ?? null,
        outcome: entry.outcome ?? null,
        signup_mode: entry.signup_mode ?? '未注明',
      },
      raw: entry.raw ?? '',
      publisherType: entry.publisher_type ?? '未注明',
      category: entry.category ?? '',
      riskLevel: entry.risk_level ?? 'none',
      riskReasons: entry.risk_reasons ?? [],
      parentId: entry.parent_id ?? null,
      merged: Boolean(entry.merged),
      flags: entry.flags ?? [],
      notes: entry.notes ?? '',
      updatedAt: null,
    };
  }

  /**
   * 由种子数据建立初始运行时数据。
   * 合并条目（09、20）不单独出卡：其变更写入父活动的变更记录，
   * 并把子条目有效的地点字段回填给父活动（数据源明确「地点以 09 为准」）。
   *
   * @param {object} seed  种子数据
   * @param {object} clock { newToken?: () => string, now?: () => string }
   */
  function buildInitialState(seed, clock) {
    const opts = clock || {};
    const now = opts.now || (() => new Date().toISOString());
    const newToken = opts.newToken || (() => null);
    const stamp = `${TERM_YEAR}-09-19T00:00:00.000Z`;

    const activities = seed.entries.map((e) => mapSeedEntry(e, newToken()));
    const byId = new Map(activities.map((a) => [a.id, a]));
    const records = [];

    for (const entry of seed.entries) {
      if (!entry.merged || !entry.parent_id) continue;
      const parent = byId.get(entry.parent_id);
      if (!parent) continue;

      // 1) 补充通知里的变更 → 父活动的初始变更记录
      const coveredLabels = new Set();
      for (const ch of entry.changes || []) {
        // 「不变」不是变更，跳过以免留下无意义记录
        if (!ch.to || ch.to === '不变' || ch.from === ch.to) {
          if (ch.field) coveredLabels.add(ch.field);
          continue;
        }
        coveredLabels.add(ch.field);
        records.push({
          activityId: parent.id,
          field: ch.field,
          fieldLabel: ch.field,
          oldValue: ch.from ?? null,
          newValue: ch.to ?? null,
          changedAt: stamp,
          reason: `数据源补充通知 ${entry.id}`,
          source: 'seed',
        });
      }

      // 2) 回填地点；若 changes 已就该字段记过一条，则不重复记录
      for (const key of ['location', 'location_status']) {
        const childVal = entry[key];
        const parentVal = parent.fields[key];
        const parentEmpty = parentVal === null || parentVal === undefined || parentVal === '未注明';
        if (!childVal || childVal === '未注明' || !parentEmpty) continue;
        const label = KEY_LABELS[key] || key;
        if (!coveredLabels.has(label)) {
          records.push({
            activityId: parent.id,
            field: key,
            fieldLabel: label,
            oldValue: parentVal ?? null,
            newValue: childVal,
            changedAt: stamp,
            reason: `数据源补充通知 ${entry.id}`,
            source: 'seed',
          });
        }
        parent.fields[key] = childVal;
      }
    }

    return {
      state: { schemaVersion: SCHEMA_VERSION, term: TERM, generatedAt: now(), activities },
      records,
    };
  }

  /**
   * 应用一次字段补充，返回改动字段与被修改的活动。
   * 只接受字符串或 null（空字符串视为清空）；不可编辑字段一律忽略。
   */
  function applyFields(activity, patch, reason, clock) {
    const opts = clock || {};
    const now = opts.now || (() => new Date().toISOString());
    const changed = [];
    const records = [];

    for (const [key, raw] of Object.entries(patch || {})) {
      if (!EDITABLE_FIELDS.includes(key)) continue;
      let value = raw;
      if (typeof value === 'string') {
        value = value.trim();
        if (value === '') value = null;
      }
      if (value !== null && typeof value !== 'string') continue;

      const oldValue = activity.fields[key] ?? null;
      if (oldValue === value) continue;
      activity.fields[key] = value;
      changed.push(key);
      records.push({
        activityId: activity.id,
        field: key,
        fieldLabel: KEY_LABELS[key] || key,
        oldValue,
        newValue: value,
        changedAt: now(),
        reason: reason || '',
        source: opts.source || 'organizer',
      });
    }
    return { changed, records };
  }

  /** 非合并条目（会出现在卡片墙上的活动） */
  function visibleActivities(state) {
    return (state.activities || []).filter((a) => !a.merged);
  }

  /** 某个活动的补充通知编号 */
  function mergedFrom(state, id) {
    return (state.activities || []).filter((a) => a.merged && a.parentId === id).map((a) => a.id);
  }

  /** 某活动的变更记录，按时间倒序 */
  function historyOf(records, id) {
    return (records || [])
      .filter((r) => r.activityId === id)
      .slice()
      .sort((a, b) => String(b.changedAt).localeCompare(String(a.changedAt)));
  }

  return {
    SCHEMA_VERSION, TERM, TERM_YEAR,
    EDITABLE_FIELDS, KEY_LABELS, DETAIL_FIELDS,
    parseWhen, computeStatus, missingFields, listItem,
    mapSeedEntry, buildInitialState, applyFields,
    visibleActivities, mergedFrom, historyOf,
  };
});

</script>
<script>
/**
 * ooxml.js —— 零依赖的 docx / pptx 文本提取
 *
 * 为什么不用 mammoth：本项目要求"零 npm 依赖、可离线运行"。docx/pptx 本质是 ZIP + XML，
 * 浏览器与 Node 都内置了 DecompressionStream('deflate-raw')，因此可以自己解压并抽取文本，
 * 无需引入任何第三方库。
 *

  const SIG_EOCD = 0x06054b50; // 中央目录结束记录
  const SIG_CEN = 0x02014b50;  // 中央目录条目
  const SIG_LOC = 0x04034b50;  // 本地文件头

  const MAX_TEXT = 20000;      // 单次预览的文本上限，防止超大文档卡住页面

    const count = u16(buf, eocd + 10);
    let p = u32(buf, eocd + 16);

    for (let i = 0; i < count; i++) {
      if (p + 46 > buf.length || u32(buf, p) !== SIG_CEN) break;
      const method = u16(buf, p + 10);
      const compSize = u32(buf, p + 20);
      const uncompSize = u32(buf, p + 24);

      const extraLen = u16(buf, p + 30);
      const commentLen = u16(buf, p + 32);

      const name = new TextDecoder('utf-8').decode(buf.subarray(p + 46, p + 46 + nameLen));

  async function readEntry(buf, entry) {

    if (u32(buf, p) !== SIG_LOC) throw new Error('本地文件头签名不符：' + entry.name);
    const nameLen = u16(buf, p + 26);
    const extraLen = u16(buf, p + 28);
    const start = p + 30 + nameLen + extraLen;
    const raw = buf.subarray(start, start + entry.compSize);
    let out;
    if (entry.method === 0) out = new Uint8Array(raw);
    else if (entry.method === 8) out = await inflateRaw(raw);
    else throw new Error('不支持的压缩方式（' + entry.method + '）：' + entry.name);
    if (out.length > MAX_ENTRY) throw new Error('条目解压后过大：' + entry.name);

  function decodeEntities(s) {

      .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
      .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(Number(d)))
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&amp;/g, '&');
  }

  /**
   * OOXML 片段转纯文本。
   * 同时兼容 WordprocessingML（w:）与 DrawingML（a:）的段落标记，
   * 因此 docx 与 pptx 共用同一套规则。
   */
  function xmlToText(xml) {
    let s = xml
      .replace(/<w:tab\b[^>]*\/?>/g, '\t')
      .replace(/<w:br\b[^>]*\/?>/g, '\n')
      .replace(/<a:br\b[^>]*\/?>/g, '\n')
      .replace(/<\/w:p>/g, '\n')
      .replace(/<\/a:p>/g, '\n')
      .replace(/<\/w:tr>/g, '\n')
      .replace(/<[^>]*>/g, '');
    s = decodeEntities(s);
    const out = [];
    for (let line of s.split('\n')) {
      line = line.replace(/[ \t]+$/, '').replace(/^[ \t]+/, '');
      if (line === '' && (out.length === 0 || out[out.length - 1] === '')) continue; // 折叠连续空行
      out.push(line);
    }
    while (out.length && out[out.length - 1] === '') out.pop();
    return out.join('\n');

  function limit(text, note) {
    if (text.length <= MAX_TEXT) return { text, truncated: false };

  /** 提取 .docx 正文，返回 { text, truncated } */
  async function docxToText(bytes) {
    const buf = toU8(bytes);
    const entries = centralDirectory(buf);
    const doc = entries.find((e) => e.name === 'word/document.xml');
    if (!doc) throw new Error('未找到 word/document.xml，可能不是 .docx 文件');
    const xml = new TextDecoder('utf-8').decode(await readEntry(buf, doc));

  function slideNo(name) {
    const m = /slide(\d+)\.xml$/.exec(name);
    return m ? Number(m[1]) : 0;
  }

  /** 提取 .pptx 每页文字，返回 [{ slide, text }] */
  async function pptxSlides(bytes) {
    const buf = toU8(bytes);
    const entries = centralDirectory(buf);
    const slides = entries
      .filter((e) => /^ppt\/slides\/slide\d+\.xml$/.test(e.name))
      .sort((a, b) => slideNo(a.name) - slideNo(b.name));
    if (!slides.length) throw new Error('未找到幻灯片内容，可能不是 .pptx 文件');
    const out = [];
    let total = 0;
    for (const s of slides) {
      const xml = new TextDecoder('utf-8').decode(await readEntry(buf, s));
      const text = xmlToText(xml);
      total += text.length;
      out.push({ slide: slideNo(s.name), text });
      if (total > MAX_TEXT) break;
    }
    return out;
  }

  return {
    MAX_TEXT,
    centralDirectory,
    readEntry,
    xmlToText,
    docxToText,
    pptxSlides,
  };
});

<script>
/**
 * app.js —— 前端共享逻辑（无框架、无构建）
 *
 * 安全约定：所有来自服务端或文档的文本一律经 esc() 转义后写入，
 * 只有 Markdown 与 docx 提取出的内容会生成 HTML，且 Markdown 渲染器
 * 先转义再套用规则、不支持内联 HTML，链接只放行 http/https。
 *
 * 与 ooxml.js 一样采用「浏览器挂全局 / Node 可 require」的写法，
 * 使转义与编码探测这类安全相关逻辑可以脱离浏览器直接做单元测试。
 */
(function (root, factory) {
  'use strict';
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.App = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const UNKNOWN = '未注明';

  // ---------------------------------------------------------------- 基础

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** 值 → 显示文本；空值统一显示为「未注明」，不显示为空白 */
  function known(v) {
    if (v == null) return { text: UNKNOWN, unknown: true };
    const s = String(v).trim();
    if (!s || s === UNKNOWN) return { text: UNKNOWN, unknown: true };
    return { text: s, unknown: false };
  }

  function val(v) {
    const k = known(v);
    return k.unknown
      ? '<span class="unknown">' + UNKNOWN + '</span>'
      : esc(k.text);
  }

  async function api(path, opts) {
    const res = await fetch(path, opts);
    let data = null;
    try { data = await res.json(); } catch { /* 非 JSON（如静态资源） */ }
    if (!res.ok) {
      const msg = (data && data.message) || ('请求失败（HTTP ' + res.status + '）');
      const err = new Error(msg);
      err.status = res.status;
      err.code = data && data.error;
      throw err;
    }
    return data;
  }

  /** 中文文本编码探测：UTF-8 严格模式失败则回退 GBK */
  function decodeText(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch {
      try { return new TextDecoder('gbk').decode(bytes); } catch { return new TextDecoder('utf-8').decode(bytes); }
    }
  }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function fmtWhen(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return String(iso);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  const STATUS_CLASS = {
    '报名中': 'open',
    '无需报名': 'free',
    '长期': 'long',
    '地点待定': 'pending',
    '报名已截止': 'closed',
    '已结束': 'closed',
  };

  function badge(status) {
    const cls = STATUS_CLASS[status] || 'closed';
    return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
  }

  // ---------------------------------------------------------------- Markdown

  /**
   * 极简 Markdown 渲染器。先整体转义，因此内联 HTML 不会生效（防 XSS）。
   * 支持：标题、粗体、斜体、行内代码、代码块、无序列表、引用、链接、表格分隔线忽略。
   */
  function markdown(src) {
    const text = String(src == null ? '' : src).replace(/\r\n?/g, '\n');
    // 1) 先摘出代码块，避免其内容被后续规则改写
    const blocks = [];
    let s = text.replace(/```([\s\S]*?)```/g, (_, code) => {
      blocks.push(code.replace(/^\n/, ''));
      return '\u0000CODE' + (blocks.length - 1) + '\u0000';
    });
    // 2) 转义
    s = esc(s);
    // 3) 行内规则
    s = s
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    // 4) 逐行组装块级结构
    const out = [];
    let list = false;
    const closeList = () => { if (list) { out.push('</ul>'); list = false; } };
    for (const rawLine of s.split('\n')) {
      const line = rawLine.trim();
      if (/^\u0000CODE\d+\u0000$/.test(line)) { closeList(); out.push('<pre>' + esc(blocks[Number(line.replace(/\D/g, ''))]) + '</pre>'); continue; }
      if (!line) { closeList(); continue; }
      const h = /^(#{1,3})\s+(.*)$/.exec(line);
      if (h) { closeList(); const n = h[1].length; out.push('<h' + n + '>' + h[2] + '</h' + n + '>'); continue; }
      if (/^&gt;\s?/.test(line)) { closeList(); out.push('<blockquote>' + line.replace(/^&gt;\s?/, '') + '</blockquote>'); continue; }
      if (/^[-*+]\s+/.test(line)) {
        if (!list) { out.push('<ul>'); list = true; }
        out.push('<li>' + line.replace(/^[-*+]\s+/, '') + '</li>');
        continue;
      }
      if (/^(?:-{3,}|\*{3,})$/.test(line)) { closeList(); out.push('<hr>'); continue; }
      closeList();
      out.push('<p>' + line + '</p>');
    }
    closeList();
    return out.join('\n');
  }

  // ---------------------------------------------------------------- 附件预览

  const KIND = {
    '.png': 'image', '.jpg': 'image', '.jpeg': 'image', '.gif': 'image', '.webp': 'image',
    '.pdf': 'pdf', '.txt': 'text', '.md': 'markdown', '.docx': 'docx', '.pptx': 'pptx',
  };

  function kindOf(file) {
    return KIND[(file.ext || '').toLowerCase()] || 'other';
  }

  async function fetchBytes(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('读取失败（HTTP ' + res.status + '）');
    return new Uint8Array(await res.arrayBuffer());
  }

  function note(html) {
    return '<div class="preview-note">' + html + '</div>';
  }

  /** 在容器内渲染附件预览。返回提示信息（若有）。 */
  async function previewFile(file, box) {
    const kind = kindOf(file);
    const url = file.url;
    box.innerHTML = note('正在生成预览…');
    try {
      if (kind === 'image') {
        box.innerHTML = '<img src="' + esc(url) + '" alt="' + esc(file.name) + '">';
        return '';
      }
      if (kind === 'pdf') {
        // 使用 Edge 内置 PDF 阅读器，无需 PDF.js
        box.innerHTML = '<iframe src="' + esc(url) + '" title="' + esc(file.name) + '"></iframe>';
        return '';
      }
      if (kind === 'text') {
        const bytes = await fetchBytes(url);
        box.innerHTML = '<pre>' + esc(decodeText(bytes)) + '</pre>';
        return '';
      }
      if (kind === 'markdown') {
        const bytes = await fetchBytes(url);
        box.innerHTML = '<div class="md">' + markdown(decodeText(bytes)) + '</div>';
        return '';
      }
      if (kind === 'docx') {
        const bytes = await fetchBytes(url);
        const r = await globalThis.OOXML.docxToText(bytes);
        box.innerHTML = '<pre>' + esc(r.text) + '</pre>';
        return '已提取文档文字，版式（字体、颜色、表格边框）不会保留。';
      }
      if (kind === 'pptx') {
        const bytes = await fetchBytes(url);
        const slides = await globalThis.OOXML.pptxSlides(bytes);
        const html = slides.map((s) =>
          '<h3>第 ' + s.slide + ' 页</h3><pre>' + esc(s.text || '（本页无文字）') + '</pre>'
        ).join('');
        box.innerHTML = '<div class="slides">' + html + '</div>';
        return 'PPT 无法在浏览器中保留版式，以上为逐页文字提取。若需看原始版式，请下载文件或向组织者索取 PDF 版本。';
      }
      box.innerHTML = note('该格式暂不支持在线预览，请下载查看。');
      return '';
    } catch (e) {
      box.innerHTML = note('预览失败：' + esc(e.message) + '　<a href="' + esc(url) + '" download>下载文件</a>');
      return '';
    }
  }

  // ---------------------------------------------------------------- 字段渲染

  /** 详情页的字段行 */
  function fieldRow(label, valueHtml) {
    return '<dt>' + esc(label) + '</dt><dd>' + valueHtml + '</dd>';
  }

  const DETAIL_FIELDS = [
    ['要求', (f) => combine([f.requirement, f.threshold, f.commitment])],
    ['面向人群', (f) => val(f.audience)],
    ['地点', (f) => val(f.location)],
    ['时间', (f) => val(f.schedule)],
    ['报名截止', (f) => val(f.deadline)],
    ['报名方式', (f) => val(f.signup_mode)],
    ['名额', (f) => val(f.quota)],
    ['费用', (f) => val(f.cost)],
    ['收获', (f) => val(f.outcome)],
  ];

  function combine(parts) {
    const list = parts.map((p) => known(p)).filter((k) => !k.unknown).map((k) => esc(k.text));
    return list.length ? list.join('　·　') : '<span class="unknown">' + UNKNOWN + '</span>';
  }

  function renderFields(f) {
    return DETAIL_FIELDS.map(([label, get]) => fieldRow(label, get(f))).join('');
  }

  return {
    UNKNOWN, esc, known, val, api, decodeText, fmtSize, fmtWhen,
    badge, markdown, kindOf, previewFile, renderFields, fieldRow, combine, STATUS_CLASS,
  };
});

</script>
<script>
/**
 * offline.js —— 离线单文件版的页面逻辑
 *
 * 由 tools/build-standalone.js 内联进生成的 HTML，不单独部署。
 *
 * 与「服务版」的区别：
 *   - 数据来自页内内嵌的 <script id="dsh-data">，不请求任何接口（file:// 下 fetch 被浏览器拦截）
 *   - 补充内容保存在内存 + 同步回数据块；「导出」会下载一个新的单文件 HTML，替换旧的那份即可
 *   - 不使用 localStorage / IndexedDB —— 这两种存储在 file:// 下各家浏览器行为不一致，不能依赖
 *   - 无补充口令、无多人共享：任何拿到该文件的人都能改
 */
(function () {
  'use strict';

  const App = window.App;
  const Model = window.Model;

  const dataEl = document.getElementById('dsh-data');
  const viewEl = document.getElementById('view');
  const statusEl = document.getElementById('save-state');

  let state = null;
  let records = [];
  let dirty = false;

  // ---------------------------------------------------------------- 数据

  function load() {
    const parsed = JSON.parse(dataEl.textContent);
    state = parsed.state;
    records = parsed.records || [];
  }

  /** 把当前数据同步回数据块，使「导出」总能得到最新状态 */
  function syncDataBlock() {
    const json = JSON.stringify({ state, records });
    // 转义 < 以杜绝数据中出现 <\/script> 截断文档
    dataEl.textContent = json.replace(/</g, '\\u003c');
    dirty = true;
    statusEl.textContent = '有未导出的改动';
    statusEl.className = 'msg warn inline';
  }

  function markClean() {
    dirty = false;
    statusEl.textContent = '';
    statusEl.className = '';
  }

  // ---------------------------------------------------------------- 工具

  const esc = App.esc;

  function activityById(id) {
    return state.activities.find((a) => a.id === id) || null;
  }

  function visible() {
    return Model.visibleActivities(state).map((a) => Model.listItem(a, new Date(), records));
  }

  function go(hash) {
    location.hash = hash;
  }

  // ---------------------------------------------------------------- 卡片墙

  let filterState = { filter: 'all', q: '' };

  function matchesFilter(it) {
    const f = filterState.filter;
    if (f === 'closed') return true;
    if (it.status === '已结束' || it.status === '报名已截止') return false;
    if (f === '零基础') return /零基础|不限基础/.test(it.fields.threshold || '');
    if (f === '无需报名') return it.status === '无需报名';
    if (f === '长期') return it.status === '长期';
    return true;
  }

  function matchesQuery(it) {
    const q = filterState.q.trim().toLowerCase();
    if (!q) return true;
    return [it.id, it.name, it.category, it.fields.location, it.fields.schedule,
      it.fields.deadline, it.fields.threshold, it.fields.audience, it.fields.requirement,
      it.fields.cost, it.fields.outcome].filter(Boolean).join(' ').toLowerCase().includes(q);
  }

  function cardHtml(it) {
    const f = it.fields;
    let badges = App.badge(it.status);
    if (it.riskLevel === 'high') badges += '<span class="badge risk">信息存疑</span>';
    else if (it.riskLevel === 'medium') badges += '<span class="badge pending">疑似推广</span>';

    const rows = [
      ['时间', App.val(f.schedule)],
      ['地点', App.val(f.location)],
      ['门槛', App.combine([f.audience, f.threshold])],
      ['截止', App.val(f.deadline)],
      ['报名', App.val(f.signup_mode)],
    ].map((r) => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('');

    const note = it.hasUpdates ? '<div class="card-note">时间或地点已有变更，见详情</div>' : '';

    return '<article class="card" data-id="' + esc(it.id) + '">' +
      '<div class="card-head"><div class="card-title"><span class="card-id">' + esc(it.id) + '</span>' +
        esc(it.name) + '</div><div class="badges">' + badges + '</div></div>' +
      '<dl class="card-fields">' + rows + '</dl>' + note +
      '<div class="card-foot"><span class="owner-link">查看详情 →</span></div>' +
      '</article>';
  }

  function renderList() {
    const items = visible().filter(matchesFilter).filter(matchesQuery);
    const chips = [['all', '全部'], ['零基础', '零基础可参加'], ['无需报名', '无需报名'],
      ['长期', '长期招募'], ['closed', '含已结束']]
      .map(([k, label]) =>
        '<button class="chip" data-filter="' + k + '" aria-pressed="' +
        (filterState.filter === k) + '">' + label + '</button>').join('');

    viewEl.innerHTML =
      '<div class="offline-banner">' +
        '<b>离线单文件版</b>　26 条活动已内嵌在本文件中，双击即可查看，无需安装任何东西。' +
        '补充内容保存在本页内存里，请点右上角<b>「导出」</b>下载新的 HTML 替换本文件；' +
        '若需要多人各自补充、汇总到同一份数据，请使用服务版（<code>start.bat</code>）。' +
      '</div>' +
      '<div class="filters">' + chips +
        '<input class="search" id="q" type="search" placeholder="搜索活动名称、地点、门槛…" value="' + esc(filterState.q) + '">' +
        '<span class="count">' + items.length + ' 条 · ' + esc(state.term || '') + '</span>' +
      '</div>' +
      (items.length ? '<div class="cards">' + items.map(cardHtml).join('') + '</div>'
                    : '<div class="empty">没有匹配的活动</div>');

    viewEl.querySelectorAll('.chip').forEach((c) => {
      c.addEventListener('click', () => { filterState.filter = c.dataset.filter; renderList(); });
    });
    const q = document.getElementById('q');
    q.addEventListener('input', () => {
      filterState.q = q.value;
      const pos = q.selectionStart;
      renderList();
      const nq = document.getElementById('q');
      nq.focus();
      nq.setSelectionRange(pos, pos);
    });
    viewEl.querySelectorAll('.card').forEach((c) => {
      c.addEventListener('click', () => go('#/a/' + c.dataset.id));
    });
  }

  // ---------------------------------------------------------------- 详情

  function historyHtml(id) {
    const list = Model.historyOf(records, id);
    if (!list.length) return '<div class="preview-note">暂无变更记录。</div>';
    return '<ul class="history">' + list.map((h) => {
      const from = h.oldValue == null || h.oldValue === '' ? '（空）' : h.oldValue;
      return '<li><span class="when">' + esc(App.fmtWhen(h.changedAt)) + '</span>' +
        '<b>' + esc(h.fieldLabel || h.field) + '</b>：' +
        '<span class="from">' + esc(from) + '</span> → ' +
        '<span class="to">' + esc(h.newValue == null ? '（清空）' : h.newValue) + '</span>' +
        (h.reason ? '　<span class="when">' + esc(h.reason) + '</span>' : '') + '</li>';
    }).join('') + '</ul>';
  }

  function riskMsg(level) {
    if (level === 'high') {
      return '<div class="msg err"><b>信息存疑：</b>该条目缺少主办方与地点等关键信息，并存在站外引流或夸大承诺的特征。请谨慎对待，不要向对方转账或提供个人敏感信息。</div>';
    }
    if (level === 'medium') {
      return '<div class="msg warn"><b>疑似商业推广：</b>该条目标题与实际内容可能不一致，请自行判断。</div>';
    }
    return '';
  }

  function renderDetail(id) {
    const a = activityById(id);
    if (!a) { viewEl.innerHTML = '<div class="empty">活动不存在</div>'; return; }

    const f = a.fields;
    let badges = App.badge(Model.computeStatus(a, new Date()));
    if (a.riskLevel === 'high') badges += '<span class="badge risk">信息存疑</span>';
    else if (a.riskLevel === 'medium') badges += '<span class="badge pending">疑似推广</span>';

    const merged = Model.mergedFrom(state, id);
    viewEl.innerHTML =
      '<p><a href="#/">← 返回全部活动</a></p>' +
      '<h1 class="detail-title">' + esc(a.name) + '</h1>' +
      '<div class="badges" style="justify-content:flex-start">' + badges + '</div>' +
      '<div class="detail-meta">编号 ' + esc(a.id) + ' · ' + esc(a.category || '未分类') +
        ' · 发布方：' + esc(a.publisherType || App.UNKNOWN) + '</div>' +
      (merged.length ? '<div class="detail-meta">已合并补充通知：' + merged.map(esc).join('、') + '</div>' : '') +
      riskMsg(a.riskLevel) +
      '<div class="panel"><h2>要求与地点</h2><dl class="fields">' + App.renderFields(f) + '</dl>' +
        (a.notes ? '<div class="preview-note">备注：' + esc(a.notes) + '</div>' : '') + '</div>' +
      '<div class="panel"><h2>📎 活动资料</h2>' +
        '<div class="preview-note">离线版不保存附件。你可以在下方选择本地文件临时预览（关闭页面即失效）；' +
        '需要把资料长期挂在活动下，请使用服务版上传。</div>' +
        '<div class="form-row"><input type="file" id="localfile" multiple ' +
          'accept=".pptx,.docx,.pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.md"></div>' +
        '<div id="preview"></div></div>' +
      '<div class="panel"><h2>🕘 更新记录</h2>' + historyHtml(id) + '</div>' +
      '<div class="panel"><div class="card-foot" style="border:0;margin:0">' +
        '<a class="btn" href="#/a/' + esc(id) + '/edit">补充 / 修正信息</a></div></div>';

    const input = document.getElementById('localfile');
    const previewBox = document.getElementById('preview');
    input.addEventListener('change', async () => {
      previewBox.innerHTML = '';
      for (const file of input.files) {
        const ext = ('.' + file.name.split('.').pop()).toLowerCase();
        const url = URL.createObjectURL(file);
        const box = document.createElement('div');
        box.className = 'preview-box';
        const title = document.createElement('div');
        title.className = 'preview-note';
        title.textContent = file.name + '（' + App.fmtSize(file.size) + '）';
        box.appendChild(title);
        previewBox.appendChild(box);
        const msg = await App.previewFile({ url, ext, name: file.name }, box);
        if (msg) {
          const n = document.createElement('div');
          n.className = 'preview-note';
          n.textContent = msg;
          box.appendChild(n);
        }
      }
    });
  }

  // ---------------------------------------------------------------- 编辑

  const SIGNUP = ['无需报名', '站内报名', '需登记', '需审核', '站内组队', '外链', '站外私聊', '候补', '未注明'];
  const DEADLINE_STATUS = ['明确', '已截止', '长期', '未注明', '无需报名'];

  function options(list, selected) {
    return list.map((v) => '<option value="' + esc(v) + '"' +
      (v === selected ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
  }

  function renderEdit(id) {
    const a = activityById(id);
    if (!a) { viewEl.innerHTML = '<div class="empty">活动不存在</div>'; return; }
    const f = a.fields;

    const textRow = (key, label, ph) =>
      '<div class="form-row"><label for="f_' + key + '">' + label + '</label>' +
      '<input type="text" id="f_' + key + '" data-field="' + key + '" placeholder="' + esc(ph) + '">' +
      '<div class="hint">当前：' + App.val(f[key]) + '　（留空表示不修改）</div></div>';

    viewEl.innerHTML =
      '<p><a href="#/a/' + esc(id) + '">← 返回活动</a></p>' +
      '<h1 class="detail-title">补充活动内容</h1>' +
      '<div class="detail-meta">编号 ' + esc(id) + ' · ' + esc(a.name) +
        '　<span style="color:var(--warn)">离线版无口令保护：任何拿到此文件的人都能修改</span></div>' +
      '<div class="panel"><h2>补充与修正</h2>' +
        '<p class="hint" style="margin-top:0">只填你能确认的内容；<b>留空表示保持原值不变</b>。每次修改都会记入更新记录并显示原值。</p>' +
        '<div class="form-grid">' +
          textRow('schedule', '活动时间', '如：9月21日 19:30—20:30') +
          textRow('deadline', '报名截止', '如：9月24日 22:00') +
        '</div>' +
        '<div class="form-row"><label for="f_deadline_status">截止状态</label>' +
          '<select id="f_deadline_status" data-field="deadline_status"><option value="">（不修改）</option>' +
          options(DEADLINE_STATUS, f.deadline_status) + '</select></div>' +
        textRow('location', '地点', '如：实验楼 A402') +
        '<div class="form-grid">' +
          textRow('quota', '名额', '如：限 30 人 / 座位有限') +
          textRow('cost', '费用', '如：免费 / AA / 30 元') +
        '</div>' +
        '<div class="form-grid">' +
          textRow('outcome', '收获', '如：第二课堂学分 0.5 / 志愿工时 4h') +
          textRow('audience', '面向人群', '如：全校学生 / 大一新生') +
        '</div>' +
        textRow('threshold', '参与门槛', '如：零基础可参加 / 需提交自我介绍') +
        '<div class="form-row"><label for="f_signup_mode">报名方式</label>' +
          '<select id="f_signup_mode" data-field="signup_mode"><option value="">（不修改）</option>' +
          options(SIGNUP, f.signup_mode) + '</select></div>' +
        '<div class="form-row"><label for="f_reason">变更原因（可选）</label>' +
          '<input type="text" id="f_reason" placeholder="如：场地调整、补充报名入口">' +
          '<div class="hint">会显示在更新记录里。</div></div>' +
        '<button class="btn" id="save">保存修改</button><div id="saveMsg"></div>' +
      '</div>';

    document.getElementById('save').addEventListener('click', () => {
      const patch = {};
      viewEl.querySelectorAll('[data-field]').forEach((el) => {
        const v = el.value.trim();
        if (!v) return;
        const old = f[el.dataset.field];
        if (v === (old == null ? '' : String(old))) return;
        patch[el.dataset.field] = v;
      });
      const reason = (document.getElementById('f_reason').value || '').trim();
      const msg = document.getElementById('saveMsg');
      if (!Object.keys(patch).length) {
        msg.innerHTML = '<div class="msg warn">没有检测到改动。</div>';
        return;
      }
      const r = Model.applyFields(a, patch, reason, { now: () => new Date().toISOString(), source: 'offline' });
      if (!r.changed.length) {
        msg.innerHTML = '<div class="msg warn">没有检测到改动。</div>';
        return;
      }
      records.push(...r.records);
      a.updatedAt = new Date().toISOString();
      syncDataBlock();
      msg.innerHTML = '<div class="msg ok">已保存 ' + r.changed.length + ' 个字段。' +
        '<a href="#/a/' + esc(id) + '">返回活动页</a>　' +
        '<b>记得点右上角「导出」保存成文件。</b></div>';
    });
  }

  // ---------------------------------------------------------------- 导出

  function exportHtml() {
    // 导出前确保数据块是最新的，再取整份文档
    syncDataBlock();
    const doctype = '<!DOCTYPE html>\n';
    const html = doctype + document.documentElement.outerHTML + '\n';
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '校园活动与机会平台.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    markClean();
    statusEl.textContent = '已导出，请用新文件替换旧文件';
    statusEl.className = 'msg ok inline';
  }

  function exportJson() {
    syncDataBlock();
    const blob = new Blob([JSON.stringify({ state, records }, null, 2)], {
      type: 'application/json;charset=utf-8',
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'activities-offline.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  // ---------------------------------------------------------------- 路由

  function route() {
    const hash = location.hash || '#/';
    const m = /^#\/a\/(\d{2})(\/edit)?$/.exec(hash);
    window.scrollTo(0, 0);
    if (!m) { renderList(); return; }
    if (m[2]) renderEdit(m[1]);
    else renderDetail(m[1]);
  }

  // ---------------------------------------------------------------- 启动

  load();
  document.getElementById('export-html').addEventListener('click', exportHtml);
  document.getElementById('export-json').addEventListener('click', exportJson);
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });
  route();
})();

</script>
</body>
</html>
